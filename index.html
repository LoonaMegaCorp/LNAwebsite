<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090506">
  <title>LNA Website is being worked on. Stand by</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #090506;
      --panel: #18090c;
      --text: #f1e8e9;
      --muted: #ad9296;
      --accent: #e32636;
      --line: #57202a;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(111, 9, 22, .24), transparent 58%),
        linear-gradient(rgba(227, 38, 54, .055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(227, 38, 54, .055) 1px, transparent 1px),
        var(--background);
      background-size: auto, 32px 32px, 32px 32px, auto;
      color: var(--text);
      font-family: "Courier New", Courier, monospace;
    }

    main {
      position: relative;
      overflow: hidden;
      width: min(100%, 680px);
      padding: clamp(28px, 7vw, 64px);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      background: linear-gradient(145deg, rgba(34, 12, 16, .98), rgba(15, 7, 9, .98));
      box-shadow: 0 24px 80px rgba(0, 0, 0, .6), 0 0 42px rgba(118, 9, 24, .12);
    }

    main::after {
      position: absolute;
      top: 0;
      right: 0;
      width: 92px;
      height: 92px;
      border-top: 1px solid rgba(227, 38, 54, .52);
      border-right: 1px solid rgba(227, 38, 54, .52);
      content: "";
      pointer-events: none;
    }

    .classification {
      display: inline-block;
      margin-bottom: 42px;
      padding: 7px 10px;
      border: 1px solid var(--accent);
      background: rgba(123, 12, 27, .22);
      color: #ff5965;
      font-size: .72rem;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: .78rem;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--accent);
      font-size: clamp(2.3rem, 8vw, 4.8rem);
      line-height: .98;
      letter-spacing: -.06em;
      text-transform: uppercase;
    }

    .rule {
      height: 2px;
      margin: 30px 0;
      border: 0;
      background: linear-gradient(90deg, var(--accent), var(--line) 68%, transparent);
    }

    .message {
      max-width: 48ch;
      margin: 0;
      color: var(--text);
      font-size: 1rem;
      line-height: 1.75;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 34px;
      color: var(--muted);
      font-size: .75rem;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .status::before {
      width: 9px;
      height: 9px;
      border-radius: 0;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(227, 38, 54, .72);
      content: "";
    }

    footer {
      margin-top: 48px;
      color: #87646a;
      font-size: .68rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <div class="classification">LNA rahhh</div>
    <p class="eyebrow">High Command stuff</p>
    <h1>Under<br>Construction</h1>
    <hr class="rule">
    <p class="message">
      This facility is undergoing scheduled reconstruction.
      All assets are advised to stand by. Public access will be restored
      when systems have reached operational compliance.
    </p>
    <div class="status">Tutututututut</div>
    <footer>Yes, LNA means Loona &nbsp;|&nbsp; LNA High Command</footer>
  </main>
</body>
</html>
