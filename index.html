<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101211">
  <title>LNA Website is being worked on. Stand by</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #121010;
      --panel: hsl(0, 8%, 10%);
      --text: #e9e4e4;
      --muted: #aaa1a1;
      --accent: #d96b6b;
      --line: #413838;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(rgba(217, 107, 107, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(217, 107, 107, 0.035) 1px, transparent 1px),
        var(--background);
      background-size: 36px 36px;
      color: var(--text);
      font-family: "Courier New", Courier, monospace;
    }

    main {
      width: min(100%, 680px);
      padding: clamp(28px, 7vw, 64px);
      border: 1px solid var(--line);
      background: rgba(28, 24, 24, 0.96);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .38);
    }

    .classification {
      display: inline-block;
      margin-bottom: 42px;
      padding: 7px 10px;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: .72rem;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: .78rem;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--accent);
      font-size: clamp(2.3rem, 8vw, 4.8rem);
      line-height: .98;
      letter-spacing: -.06em;
      text-transform: uppercase;
    }

    .rule {
      height: 1px;
      margin: 30px 0;
      border: 0;
      background: var(--line);
    }

    .message {
      max-width: 48ch;
      margin: 0;
      color: var(--text);
      font-size: 1rem;
      line-height: 1.75;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 34px;
      color: var(--muted);
      font-size: .75rem;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .status::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(217, 107, 107, 0.65);
      content: "";
    }

    footer {
      margin-top: 48px;
      color: #7a7272;
      font-size: .68rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <div class="classification">LNA rahhh</div>
    <p class="eyebrow">High Command stuff</p>
    <h1>Under<br>Construction</h1>
    <hr class="rule">
    <p class="message">
      This facility is undergoing scheduled reconstruction.
      All assets are advised to stand by. Public access will be restored
      when systems have reached operational compliance.
    </p>
    <div class="status">Tutututututut</div>
    <footer>Yes, LNA means Loona &nbsp;|&nbsp; LNA High Command</footer>
  </main>
</body>
</html>
